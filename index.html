<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- نفس الرأس السابق ... -->
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="fixed top-0 w-full z-50 glass transition-colors duration-300">
        <div class="max-w-2xl mx-auto px-2 sm:px-4 py-3 flex items-center gap-2 min-w-0">
            <!-- Search bar -->
            <div class="flex-1 min-w-0 relative">
                <input id="search-input" type="text" placeholder="ابحث بمفتاح عام (npub أو hex)..."
                       class="w-full bg-gray-100/80 dark:bg-surface/80 rounded-full px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-accent placeholder-gray-500 dark:text-white">
                <button onclick="searchUser()" class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-accent">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div class="flex items-center gap-1.5 flex-shrink-0">
                <!-- Theme toggle (مؤقت، يمكن نقله للإعدادات) -->
                <button onclick="toggleTheme()"
                        class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-gray-200/70 dark:hover:bg-gray-700/50 transition shrink-0">
                    <i class="fas fa-moon dark:hidden text-gray-700"></i>
                    <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                </button>

                <!-- Import key button (رمز مفتاح) -->
                <button onclick="importKeyFromHeader()"
                        class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-gray-200/70 dark:hover:bg-gray-700/50 transition shrink-0"
                        title="استيراد مفتاح خاص">
                    <i class="fas fa-key text-gray-700 dark:text-gray-300"></i>
                </button>

                <!-- Profile avatar -->
                <button onclick="openProfileModal()"
                        class="w-9 h-9 rounded-full overflow-hidden bg-gradient-to-br from-accent to-accent2 flex items-center justify-center shrink-0 shadow-md">
                    <img id="header-avatar-img" src="" alt="" class="hidden w-full h-full object-cover">
                    <span id="header-avatar-fallback" class="text-white text-sm font-black">P</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="max-w-2xl mx-auto pt-20 pb-24 px-4">

        <!-- ===== TIMELINE VIEW ===== -->
        <div id="view-timeline" class="view-section fade-in">
            <!-- ... (نفس الكود السابق) ... -->
        </div>

        <!-- ===== ROOMS VIEW ===== -->
        <div id="view-rooms" class="view-section hidden fade-in">
            <!-- ... (نفس الكود السابق) ... -->
        </div>

        <!-- ===== SETTINGS VIEW (جديد) ===== -->
        <div id="view-settings" class="view-section hidden fade-in">
            <div class="bg-white dark:bg-cardDark rounded-3xl p-6 shadow-soft border border-gray-100 dark:border-gray-800">
                <h2 class="text-2xl font-bold mb-6 dark:text-white">⚙️ الإعدادات</h2>

                <!-- Theme toggle -->
                <div class="flex items-center justify-between py-3 border-b border-gray-100 dark:border-gray-700">
                    <div>
                        <p class="font-medium dark:text-white">المظهر</p>
                        <p class="text-xs text-gray-400">الوضع الليلي / النهاري</p>
                    </div>
                    <button onclick="toggleTheme()"
                            class="px-4 py-2 rounded-full bg-gray-200 dark:bg-gray-700 text-sm font-medium hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                        <span class="dark:hidden">🌙 ليلي</span>
                        <span class="hidden dark:inline">☀️ نهاري</span>
                    </button>
                </div>

                <!-- Edit profile -->
                <button onclick="openProfileModal()"
                        class="w-full flex items-center gap-3 py-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition rounded-lg px-2">
                    <i class="fas fa-user-edit text-accent w-6"></i>
                    <span class="dark:text-white">تعديل الملف الشخصي</span>
                </button>

                <!-- Copy npub -->
                <button onclick="copyNpub()"
                        class="w-full flex items-center gap-3 py-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition rounded-lg px-2">
                    <i class="fas fa-copy text-blue-500 w-6"></i>
                    <span class="dark:text-white">نسخ npub</span>
                </button>

                <!-- Export private key -->
                <button onclick="exportKey()"
                        class="w-full flex items-center gap-3 py-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition rounded-lg px-2">
                    <i class="fas fa-key text-orange-500 w-6"></i>
                    <span class="dark:text-white">تصدير المفتاح الخاص (nsec)</span>
                </button>

                <!-- Admin panel (يظهر فقط للمدير) -->
                <button id="settings-admin-btn" onclick="openAdminPanel()"
                        class="hidden w-full flex items-center gap-3 py-3 hover:bg-gray-50 dark:hover:bg-gray-800 transition rounded-lg px-2 mt-2">
                    <i class="fas fa-shield-alt text-red-500 w-6"></i>
                    <span class="dark:text-white">👮 لوحة الإدارة (حظر المستخدمين)</span>
                </button>
            </div>
        </div>

    </main>

    <!-- ========== BOTTOM NAV ========== -->
    <nav class="fixed bottom-0 w-full glass z-50 pb-safe transition-colors duration-300">
        <div class="max-w-2xl mx-auto flex justify-around py-3">
            <button onclick="switchView('timeline')" id="nav-timeline"
                    class="nav-btn active flex flex-col items-center gap-1 text-accent transition">
                <i class="fas fa-home text-2xl"></i>
                <span class="text-xs font-bold">الرئيسية</span>
            </button>

            <button onclick="switchView('rooms')" id="nav-rooms"
                    class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-accent transition">
                <i class="fas fa-microphone-lines text-2xl"></i>
                <span class="text-xs font-bold">غرف صوتية</span>
            </button>

            <!-- Settings button (بدلاً من زر الإدارة) -->
            <button onclick="switchView('settings')" id="nav-settings"
                    class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-accent transition">
                <i class="fas fa-sliders-h text-2xl"></i>
                <span class="text-xs font-bold">إعدادات</span>
            </button>
        </div>
    </nav>

    <!-- ========== باقي المودالات (نفس السابق) ========== -->

    <!-- ========== SCRIPTS ========== -->
    <script src="./config.js"></script>
    <script src="./state.js"></script>
    <script src="./utils.js"></script>
    <script src="./auth.js"></script>
    <script src="./profile.js"></script>
    <script src="./algorithm.js"></script>
    <script src="./media.js"></script>
    <script src="./posts.js"></script>
    <script src="./reactions.js"></script>
    <script src="./rooms.js"></script>
    <script src="./ui.js"></script>
    <script src="./main.js"></script>

</body>
</html>
